(function(){
const $=id=>document.getElementById(id),defaults={name:'VOXEN FIGHTER',description:'WELCOME TO—VOXEN FIGHTER\n#VOXEN ANTI-DIMMING...',limit:44,full:false,members:126,titleFont:'serif',profileKind:'default',profileData:''},emojis=__EMOJIS__,avatar='__AVATAR__';let p=__SSGC_DATA__,height=1600,sequence=0;

function replaceEmojis(el){const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const node of nodes){const frag=document.createDocumentFragment();let changed=false;for(const c of segment(node.data)){const key=Array.from(c).map(x=>x.codePointAt(0).toString(16)).join('-'),src=emojis[key]||emojis[key.replace(/-fe0f/g,'')]||(c==='❤'?emojis['2764-fe0f']:null);if(src){const img=new Image();img.src=src;img.alt=c;img.className='emoji';frag.append(img);changed=true;}else frag.append(document.createTextNode(c));}if(changed)node.replaceWith(frag);}}
function normal(raw){const d={...defaults,...p,...raw};d.name=segment(String(d.name||defaults.name).trim()).slice(0,64).join('')||defaults.name;d.description=segment(String(d.description??defaults.description).replace(/\r\n?/g,'\n')).slice(0,2000).join('');const n=Number(d.limit);d.limit=Number.isInteger(n)&&n>=0&&n<=2000?n:44;d.full=d.full===true||d.full==='1'||d.limit===0;d.members=Math.min(999999,Math.max(0,Math.round(Number(d.members)||0)));d.titleFont=d.titleFont==='sans'?'sans':'serif';d.profileKind=['default','image','none'].includes(d.profileKind)?d.profileKind:'default';d.profileData=typeof d.profileData==='string'&&/^data:image\/(png|jpeg|webp|gif|avif|bmp);base64,[A-Za-z0-9+/=]+$/.test(d.profileData)?d.profileData:'';return d;}
async function render(raw){const run=++sequence;window.__ssgcReady=false;window.__ssgcError=null;p=normal(raw);const same=Object.keys(defaults).every(k=>p[k]===defaults[k]);$('reference').hidden=!same;$('dynamic').hidden=same;
if(!same){const sourceName=p.name===defaults.name&&p.titleFont==='serif';$('namePhoto').hidden=!sourceName;$('nameText').hidden=sourceName;$('name').classList.toggle('sans',p.titleFont==='sans');$('nameText').textContent=p.name;replaceEmojis($('nameText'));
$('avatar').hidden=p.profileKind==='none';$('profileImage').src=p.profileKind==='image'?p.profileData:avatar;
const sourceMembers=p.members===126;$('membersPhoto').hidden=!sourceMembers;$('groupLabel').hidden=sourceMembers;$('memberValue').hidden=sourceMembers;$('memberValue').textContent=p.members+' anggota';
const all=segment(p.description),cut=!p.full&&p.limit>0&&all.length>p.limit,visible=(cut?all.slice(0,p.limit):all).join('');window.__ssgcDescription={length:all.length,shown:segment(visible).length,truncated:cut,visible};const sourceDesc=p.description===defaults.description&&p.limit===44&&!p.full;$('descPhoto').hidden=!sourceDesc;$('descText').hidden=sourceDesc;$('descText').textContent=visible;replaceEmojis($('descText'));$('ellipsis').hidden=sourceDesc||!cut;$('more').hidden=sourceDesc||!cut;}
await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r;})));if(run!==sequence)return;
if(!same&&p.profileKind==='image'&&!$('profileImage').naturalWidth){window.__ssgcError='PROFILE_DECODE_FAILED';return;}
const titleHeight=same?60:Math.max(60,$('name').offsetHeight),delta=titleHeight-60,descriptionTop=431+delta,descriptionHeight=same?77:Math.max(77,$('description').offsetHeight),footerTop=descriptionTop+descriptionHeight+18;
height=same?1600:Math.max(1600,footerTop+1074);if(height>20000){window.__ssgcError='OUTPUT_TOO_TALL';return;}
$('members').style.top=(374+delta)+'px';$('description').style.top=descriptionTop+'px';$('footer').style.top=footerTop+'px';$('frame').style.height=height+'px';fit();window.__ssgcReady=true;}
addEventListener('resize',fit);addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='SSGC_UPDATE')render(e.data.data);});render(p);
})();</script></body></html>
