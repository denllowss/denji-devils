<style>
.dl-wrap{
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

.dl-card{
  background: var(--button-style-background);
  border: 2px solid var(--button-style-border-color);
  border-radius: var(--link-radius);
  box-shadow: var(--button-style-shadow);
  padding: 16px;
  margin-bottom: 20px;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}

.dl-card:focus-within{
  transform: translateY(-2px);
  box-shadow: 4px 6px 0 var(--button-style-shadow-color);
}

.dl-form{
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.dl-input-group{
  position: relative;
  display: flex;
  align-items: center;
  background: #ffffff;
  border: 2px solid var(--button-style-border-color);
  border-radius: 20px;
  padding: 4px 6px 4px 14px;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}

.dl-input-group:focus-within{
  border-color: #1e2330;
  box-shadow: 0 0 0 3px rgba(50, 60, 31, 0.15);
}

.dl-input-icon{
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  color: #718096;
  margin-right: 10px;
}

.dl-input{
  flex: 1;
  width: 100%;
  min-width: 0;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: #1e2330;
  outline: none;
  padding: 8px 0;
}

.dl-input::placeholder{
  color: #a0aec0;
  font-weight: 400;
}

.dl-paste-btn{
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #f7fafc;
  border: 1.5px solid #cbd5e0;
  border-radius: 14px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #4a5568;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
}

.dl-paste-btn:hover{
  background: #edf2f7;
  color: #1a202c;
  border-color: #a0aec0;
}

.dl-paste-btn:active{
  transform: scale(0.96);
}

.dl-submit-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: var(--button-style-border-color);
  color: #f1fcbd;
  border: 2px solid var(--button-style-border-color);
  border-radius: 22px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
  transition: all var(--t-fast) var(--ease);
}

.dl-submit-btn:hover:not(:disabled){
  transform: translateY(-2px);
  box-shadow: 3px 5px 0 rgba(0, 0, 0, 0.2);
  background: #232a15;
}

.dl-submit-btn:active:not(:disabled){
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 transparent;
}

.dl-submit-btn:disabled{
  opacity: 0.65;
  cursor: not-allowed;
}

.dl-badges{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

.dl-badge{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid rgba(50, 60, 31, 0.2);
  border-radius: 12px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 600;
  color: var(--bodyText);
}

.dl-loader{
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 12px;
  text-align: center;
}

.dl-loader.active{
  display: flex;
}

.dl-spinner{
  width: 38px;
  height: 38px;
  border: 3.5px solid rgba(50, 60, 31, 0.2);
  border-top-color: var(--button-style-border-color);
  border-radius: 50%;
  animation: dlSpin 0.75s linear infinite;
}

@keyframes dlSpin{
  to { transform: rotate(360deg); }
}

.dl-result{
  display: none;
  background: #ffffff;
  border: 2px solid var(--button-style-border-color);
  border-radius: var(--link-radius);
  box-shadow: var(--button-style-shadow);
  padding: 18px;
  margin-bottom: 24px;
  animation: popIn 0.35s var(--ease-pop) both;
}

.dl-result.active{
  display: block;
}

.res-header{
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1.5px solid #edf2f7;
  margin-bottom: 14px;
}

.res-avatar{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--button-style-border-color);
  background: #f7fafc;
  flex-shrink: 0;
}

.res-author-info{
  flex: 1;
  min-width: 0;
}

.res-author-name{
  font-size: 14px;
  font-weight: 700;
  color: #1a202c;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.res-author-user{
  font-size: 12px;
  color: #718096;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.res-platform-tag{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.res-platform-tag.tiktok{
  background: #000000;
  color: #ffffff;
}

.res-platform-tag.instagram{
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  color: #ffffff;
}

.res-title{
  font-size: 13px;
  line-height: 1.5;
  color: #2d3748;
  margin-bottom: 14px;
  word-break: break-word;
  max-height: 80px;
  overflow-y: auto;
}

.res-media-box{
  border-radius: 16px;
  overflow: hidden;
  background: #000000;
  margin-bottom: 16px;
  border: 1.5px solid #e2e8f0;
}

.res-video{
  width: 100%;
  max-height: 420px;
  display: block;
  outline: none;
  background: #000000;
}

.res-gallery{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  padding: 8px;
  max-height: 380px;
  overflow-y: auto;
  background: #f7fafc;
}

.res-gallery-item{
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 1;
  background: #edf2f7;
  border: 1px solid #e2e8f0;
}

.res-gallery-img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: auto!important;
  cursor: pointer;
}

.res-actions{
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.res-btn{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 13.5px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: 2px solid var(--button-style-border-color);
  transition: all var(--t-fast) var(--ease);
}

.res-btn-primary{
  background: var(--button-style-border-color);
  color: #f1fcbd;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
}

.res-btn-primary:hover{
  background: #232a15;
  transform: translateY(-2px);
  box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.2);
}

.res-btn-secondary{
  background: #f1fcbd;
  color: #1e2330;
  box-shadow: 2px 3px 0 var(--button-style-border-color);
}

.res-btn-secondary:hover{
  background: #e0eab0;
  transform: translateY(-2px);
}

.res-btn-outline{
  background: #ffffff;
  color: #2d3748;
  border-color: #cbd5e0;
}

.res-btn-outline:hover{
  background: #f7fafc;
  border-color: #a0aec0;
}

.res-btn:active{
  transform: scale(0.98);
}

.dl-error-box{
  display: none;
  background: #fff5f5;
  border: 2px solid #feb2b2;
  border-radius: 18px;
  padding: 14px 16px;
  color: #c53030;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  text-align: center;
  line-height: 1.4;
}

.dl-error-box.active{
  display: block;
}

.nav-home-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 12px auto 24px;
  padding: 8px 18px;
  background: rgba(255, 255, 255, 0.65);
  border: 1.5px solid var(--button-style-border-color);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--bodyText);
  box-shadow: 2px 2px 0 var(--button-style-border-color);
  transition: all var(--t-fast) var(--ease);
}

.nav-home-btn:hover{
  background: #ffffff;
  transform: translateY(-1px);
}
</style>
