 const frame=document.getElementById('frame'),card=document.getElementById('card'),menu=document.getElementById('menu'),reference=document.getElementById('reference');
 let data=__IQC3_DATA__;
 let height=1308;
 function layout(){
   const menuTop=544+card.offsetHeight+33;
   menu.style.top=menuTop+'px';
   height=Math.max(1308,menuTop+380);
   frame.style.height=height+'px';
   const scale=Math.min(1,innerWidth/736);
   frame.style.transform='scale('+scale+')';
   document.body.style.height=Math.ceil(height*scale)+'px';
   window.__iqc3Height=height;
   window.__iqc3Ready=true;
   if(parent!==window)parent.postMessage({type:'IQC3_SIZE',height:Math.ceil(height*scale)},location.origin);
 }
 function hex(v,defaultValue){return /^#[\da-f]{6}$/i.test(v||'')?v:defaultValue;}
 function update(next){
   data=Object.assign({},DEFAULTS,next);
   data.color1=hex(data.color1,DEFAULTS.color1);data.color2=hex(data.color2,DEFAULTS.color2);data.color=hex(data.color,DEFAULTS.color);
   data.background=data.background==='solid'?'solid':'gradient';
   data.angle=Number.isFinite(Number(data.angle))?Math.max(0,Math.min(360,Number(data.angle))):135;
   ['lyrics','music','artist','time'].forEach(key=>data[key]=String(data[key]||DEFAULTS[key]).slice(0,key==='lyrics'?1000:key==='time'?10:100));
   const exact=Object.keys(DEFAULTS).every(k=>data[k]===DEFAULTS[k]);
   const nativeGradient=data.background==='gradient'&&data.color1===DEFAULTS.color1&&data.color2===DEFAULTS.color2&&data.angle===135;
   reference.style.display=exact?'block':'none';
   const background=data.background==='solid'?data.color:(nativeGradient?ORIGINAL_GRADIENT:'linear-gradient('+data.angle+'deg,'+data.color1+','+data.color2+')');
   card.style.setProperty('--card-background',background);
   card.style.setProperty('--tail-color',data.background==='solid'?data.color:nativeGradient?'#63532e':data.color2);
   document.getElementById('lyrics').textContent=data.lyrics===DEFAULTS.lyrics?"I don't regret, just\npretend shit never\nhappened":data.lyrics;
   ['music','artist','time'].forEach(key=>document.getElementById(key).textContent=data[key]);
   layout();
   Promise.resolve(document.fonts.ready).then(layout);
 }
 window.setIqc3=update;
 window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===parent&&event.data&&event.data.type==='IQC3_UPDATE')update(event.data.data);});
 window.addEventListener('resize',layout);
 update(data);
 document.fonts.ready.then(layout);
})();
